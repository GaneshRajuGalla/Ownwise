name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (must match ASC version)
        required: true
        default: '1.0'
      build_number:
        description: Build number (must be unique per version)
        required: true
        default: '1'
      submit_for_review:
        description: Submit to App Store review after upload
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-26
    env:
      ASC_APP_ID: ${{ secrets.APP_STORE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          PICK=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode27*.app 2>/dev/null | sort | tail -1)
          if [ -z "$PICK" ]; then echo "Xcode 27 not found:"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$PICK/Contents/Developer" && xcodebuild -version

      - name: Resolve test simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d = json.load(sys.stdin)['devices']
          names = []
          for rt, devs in d.items():
              if 'iOS' not in rt: continue
              for x in devs:
                  if x.get('isAvailable') and 'iPhone' in x['name']: names.append(x['name'])
          for want in ['iPhone 18 Pro', 'iPhone 17 Pro', 'iPhone 17', 'iPhone 16 Pro']:
              if want in names: print(want); break
          else: print(names[0] if names else '')
          ")
          [ -z "$NAME" ] && { echo "no simulator"; exit 1; }
          echo "device=$NAME" >> "$GITHUB_OUTPUT" && echo "Using: $NAME"

      - name: Install asc CLI
        run: brew install asc && asc --version

      - name: Authenticate App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.asc
          printf '%s' "$ASC_API_PRIVATE_KEY" > ~/.asc/AuthKey.p8
          chmod 600 ~/.asc/AuthKey.p8
          asc auth login --bypass-keychain --name ci \
            --key-id "$ASC_API_KEY_ID" \
            --issuer-id "$ASC_API_ISSUER_ID" \
            --private-key ~/.asc/AuthKey.p8 \
            --skip-validation
          asc auth status

      - name: Set version and build number
        run: asc xcode version edit --version "${{ inputs.version }}" --build-number "${{ inputs.build_number }}"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Ownwise.xcodeproj \
            -scheme Ownwise \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.device }}' \
            -only-testing:OwnwiseTests

      - name: Archive (App Store signing via API key)
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project Ownwise.xcodeproj \
            -scheme Ownwise \
            -configuration Release \
            -archivePath build/Ownwise.xcarchive \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.asc/AuthKey.p8 \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Ownwise.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist
          ls -la build/ipa/

      - name: Upload to TestFlight (no submit)
        if: ${{ !inputs.submit_for_review }}
        run: |
          asc publish testflight \
            --app "$ASC_APP_ID" \
            --ipa build/ipa/Ownwise.ipa \
            --upload-only --wait --output json

      - name: Upload + submit for App Store review
        if: ${{ inputs.submit_for_review }}
        run: |
          asc publish appstore \
            --app "$ASC_APP_ID" \
            --ipa build/ipa/Ownwise.ipa \
            --version "${{ inputs.version }}" \
            --metadata-dir ./metadata \
            --submit --confirm --output json
