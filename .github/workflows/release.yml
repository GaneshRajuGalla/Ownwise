name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 1.0.0)
        required: true
        default: 1.0.0
      build_number:
        description: Build number
        required: true
        default: '1'
      submit_for_review:
        description: Submit for review after upload
        required: false
        default: 'false'

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true

      - name: Authenticate App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.asc
          printf '%s' "$ASC_API_PRIVATE_KEY" > ~/.asc/AuthKey.p8
          echo "ASC auth configured"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -scheme Ownwise \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro' \
            -only-testing:OwnwiseTests \
            -quiet

      - name: Archive
        run: |
          xcodebuild archive \
            -scheme Ownwise \
            -configuration Release \
            -archivePath build/Ownwise.xcarchive \
            -destination 'generic/platform=iOS'

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Ownwise.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f build/ipa/Ownwise.ipa \
            -t ios \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}" || \
          xcrun notarytool submit build/ipa/Ownwise.ipa --help | head -5
